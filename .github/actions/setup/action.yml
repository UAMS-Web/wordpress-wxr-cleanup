name: Set up PHP and Composer
description: Install PHP (8.4 by default), restore the Composer cache, and install the locked dependencies. Run after actions/checkout.

# Copied from .claude/skills/code-quality/templates/setup-action.yml. ci.yml calls it as
# `./.github/actions/setup`. The cache key hashes composer.json because this repository
# commits no composer.lock.

inputs:
  php-version:
    description: The PHP version to install.
    required: false
    default: '8.4'
  coverage:
    description: The coverage driver to install, as shivammathur/setup-php names it. `none` for every job except the one that runs mutation testing, which passes `pcov`.
    required: false
    default: none

runs:
  using: composite
  steps:
    - name: Set up PHP ${{ inputs.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: ${{ inputs.coverage }}
        tools: composer:v2

    - name: Determine Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer packages
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles('composer.json') }}
        restore-keys: composer-${{ runner.os }}-

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --no-progress --prefer-dist
